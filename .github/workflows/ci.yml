name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MCP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcp
      - name: Check out TypeScript SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alsk1992/strata-sdk-ts
          path: sdk
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Pack SDK source
        working-directory: sdk
        run: npm ci && npm run ci && mkdir ../packages && npm pack --pack-destination ../packages
      - name: Install MCP dependencies against SDK source
        working-directory: mcp
        run: cp package.json package.publish.json; npm pkg delete dependencies.@stratabook/sdk; npm install --ignore-scripts --package-lock=false; cp package.publish.json package.json; npm install --no-save --package-lock=false ../packages/stratabook-sdk-*.tgz
      - name: Verify MCP
        working-directory: mcp
        run: npm run ci
